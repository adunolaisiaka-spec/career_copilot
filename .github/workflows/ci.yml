name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    name: Typecheck, lint, build, unit tests
    runs-on: ubuntu-latest
    env:
      DATABASE_URL: postgresql://user:pass@localhost:5432/placeholder
      AUTH_SECRET: ci-placeholder-secret-not-for-prod-use
      NEXTAUTH_URL: http://localhost:3000
      AI_PROVIDER: mock
      STORAGE_PROVIDER: local
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - run: npm ci

      - run: npx prisma generate

      - name: Lint
        run: npm run lint

      - name: Build (includes Next.js's own type-check + static analysis)
        run: npm run build

      - name: Unit tests
        run: npm test

  integration:
    name: Integration tests (real test DB)
    runs-on: ubuntu-latest
    needs: build
    env:
      TEST_DATABASE_URL: ${{ secrets.TEST_DATABASE_URL }}
    # GitHub Actions doesn't allow `secrets` in a job-level `if:`, so each step
    # below is individually gated on the job's own `env` instead — this job
    # only does real work once a TEST_DATABASE_URL secret is configured (see
    # README.md); otherwise every step is skipped and the job reports green.
    steps:
      - name: Skip notice
        if: ${{ env.TEST_DATABASE_URL == '' }}
        run: echo "TEST_DATABASE_URL secret not set — skipping integration tests. See README.md."

      - uses: actions/checkout@v4
        if: ${{ env.TEST_DATABASE_URL != '' }}

      - uses: actions/setup-node@v4
        if: ${{ env.TEST_DATABASE_URL != '' }}
        with:
          node-version: 24
          cache: npm

      - run: npm ci
        if: ${{ env.TEST_DATABASE_URL != '' }}

      - run: npx prisma generate
        if: ${{ env.TEST_DATABASE_URL != '' }}

      - name: Integration tests
        if: ${{ env.TEST_DATABASE_URL != '' }}
        run: npm run test:integration
